name: Testing

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - run: ./scripts/test/unit

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  # Add once a module has previews and committed baselines. Runs on macOS because baselines are
  # recorded on a Mac, and text renders differently on Linux.
  #
  # screenshot-tests:
  #   name: Screenshot tests
  #   runs-on: macos-latest
  #   ...
  #   - run: ./scripts/test/screenshot

  # Add once there are instrumented tests, using Gradle Managed Devices (API 34+, which the
  # accessibility checks need).
  #
  # instrumented-tests:
  #   name: Instrumented tests
  #   runs-on: ubuntu-latest
  #   ...
  #   - run: ./scripts/test/instrumented
