name: Setup
description: Installs a JDK and Gradle, with Gradle's dependency and build caches.

runs:
  using: composite
  steps:
    # Only used to launch Gradle: gradle/gradle-daemon-jvm.properties picks the JDK the build runs on.
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
